worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;

  # Path-prefix gateway so one public host can front all four services.
  # Browser calls:  https://HOST/inventory/events  -> inventory-service /events
  #                 https://HOST/orders/orders/:id -> order-service /orders/:id
  #                 https://HOST/payments/...      -> payment-service
  #                 https://HOST/notifications/... -> notification-service

  upstream inventory { server inventory:3001; }
  upstream orders { server order:3002; }
  upstream payments { server payment:3003; }
  upstream notifications { server notification:3004; }

  server {
    listen 80;
    server_name _;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers * always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":true}';
    }

    location /inventory/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://inventory/;
    }

    location /orders/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://orders/;
    }

    location /payments/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://payments/;
    }

    location /notifications/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://notifications/;
    }
  }
}
